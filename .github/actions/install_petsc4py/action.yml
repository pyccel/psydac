name: 'Install PETSc and petsc4py'
description: 'Install PETSc and petsc4py with complex support'

inputs:
  petsc-version:
    description: 'Release of PETSc to download and build (Git tag)'
    default: 'v3.25.5'

runs:
  using: "composite"
  steps:

    # The cached PETSc can only be reused with the same MPI library, compilers,
    # Python version, and build steps (see #641)
    - name: Compute cache key for PETSc
      id: petsc-key
      shell: bash
      env:
        PETSC_VERSION: ${{ inputs.petsc-version }}
        ACTION_HASH: ${{ hashFiles('.github/actions/install_petsc4py/action.yml') }}
      run: |
        # The MPI version is read from the macros of mpi.h, because `mpirun --version`
        # fails on some images (missing help files of PRRTE). A separate assignment
        # makes the step fail if mpi.h cannot be found
        mpi_version=$(echo '#include <mpi.h>' | mpicc -E -dM -x c - \
          | grep -E '#define (MPI_VERSION|MPI_SUBVERSION|OMPI_(MAJOR|MINOR|RELEASE)_VERSION|MPICH_VERSION|I_MPI_VERSION) ' \
          | sort)
        versions=$( { mpicc --version; echo "$mpi_version"; python --version; } 2>&1 )
        # Print the hashed text, to see why the key changes if the cache is invalidated
        echo "::group::Versions of MPI, compilers, and Python"
        echo "$versions"
        echo "::endgroup::"
        toolchain=$(echo "$versions" | shasum -a 256 | cut -c1-12)
        key="petsc-${PETSC_VERSION}-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${toolchain}-${ACTION_HASH:0:12}"
        echo "PETSc cache key: $key"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Cache PETSc
      uses: actions/cache@v6
      id: cache-petsc
      with:
        path: "./petsc"
        key: ${{ steps.petsc-key.outputs.key }}

    - if: steps.cache-petsc.outputs.cache-hit != 'true'
      name: Download a specific release of PETSc
      shell: bash
      env:
        PETSC_VERSION: ${{ inputs.petsc-version }}
      run: |
        git clone --depth 1 --branch "$PETSC_VERSION" https://gitlab.com/petsc/petsc.git
      # The branch "release" contains work towards the next version of PETSc,
      # and it may not be stable. If necessary, it can be cloned as follows:
      # git clone --depth 1 --branch release https://gitlab.com/petsc/petsc.git

    - if: steps.cache-petsc.outputs.cache-hit != 'true'
      name: Install PETSc with complex support
      shell: bash
      working-directory: ./petsc
      run: |
        export PETSC_DIR=$(pwd)
        export PETSC_ARCH=petsc-cmplx
        ./configure --with-scalar-type=complex --with-fortran-bindings=0 --have-numpy=1         
        make all
        echo "PETSC_DIR=$PETSC_DIR" > petsc.env
        echo "PETSC_ARCH=$PETSC_ARCH" >> petsc.env

    # This step is not really necessary and could be combined with PETSc install
    # step; however it's good to verify if the cached PETSc installation really works!
    - name: Test PETSc installation
      shell: bash
      working-directory: ./petsc
      run: |
        source petsc.env
        make check
        echo "PETSC_DIR=$PETSC_DIR" >> $GITHUB_ENV
        echo "PETSC_ARCH=$PETSC_ARCH" >> $GITHUB_ENV

    - name: Install petsc4py
      shell: bash
      working-directory: ./petsc
      run: | 
        pip install wheel numpy
        pip install src/binding/petsc4py
