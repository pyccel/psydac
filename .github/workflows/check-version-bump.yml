name: Check version bump

on:
  pull_request:
    branches: [devel-tiny]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    name: Version is higher than the latest PyPI release

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging
        run: python -m pip install packaging

      - name: Compare pyproject.toml version with PyPI
        run: python .github/scripts/check_version_bump.py pyproject.toml
